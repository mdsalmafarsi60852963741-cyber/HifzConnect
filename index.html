<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<meta name="theme-color" content="#07583f">
<link rel="icon" type="image/png" href="./file_00000000485c8211bf81374240c59fe9.png">
<title>হেফজ কন্টাক — সহজ যোগাযোগ</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    font-family:"Noto Sans Bengali","Noto Sans",Arial,sans-serif;
    background:#edf7f2;
    color:#17382d;
    overflow-x:hidden;
}

.app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    margin:auto;
    background:#f8fcfa;
}

/* =========================
   HEADER
========================= */

.header{
    background:linear-gradient(145deg,#07583f,#12845f);
    color:white;
    padding:18px 16px 25px;
    border-radius:0 0 30px 30px;
}

.top{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo{
    width:50px;
    height:50px;
    border-radius:15px;
    background:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:27px;
    box-shadow:0 4px 12px rgba(0,0,0,.15);
}

.brand{
    flex:1;
}

.brand h1{
    font-family:Arial,sans-serif;
    font-size:25px;
    font-weight:bold;
}

.brand h1 span{
    color:#e5b83e;
}

.brand p{
    margin-top:3px;
    color:#f4d16a;
    font-size:13px;
}

.header-title{
    margin-top:22px;
}

.header-title small{
    color:#d9eee6;
    font-size:13px;
}

.header-title h2{
    margin-top:5px;
    font-size:20px;
    line-height:1.6;
}

/* =========================
   CONTENT
========================= */

.content{
    padding:18px 15px 30px;
}

.search{
    width:100%;
    padding:14px 15px;
    border:1px solid #d7e7df;
    border-radius:15px;
    background:white;
    font-size:15px;
    outline:none;
    box-shadow:0 4px 14px rgba(0,0,0,.04);
}

.add-btn{
    width:100%;
    margin-top:14px;
    border:0;
    border-radius:15px;
    padding:14px;
    background:#07583f;
    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.add-btn:active{
    transform:scale(.98);
}

.count{
    margin:14px 2px 10px;
    color:#71817b;
    font-size:13px;
}

/* =========================
   STUDENT CARD
========================= */

.student{
    background:white;
    border:1px solid #dfebe5;
    border-radius:18px;
    padding:14px;
    margin-bottom:11px;
    box-shadow:0 5px 15px rgba(0,0,0,.05);
}

.student-head{
    display:flex;
    align-items:center;
    gap:11px;
}

.avatar{
    width:45px;
    height:45px;
    border-radius:14px;
    background:#e7f5ed;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:23px;
}

.student-name{
    font-size:17px;
    font-weight:bold;
    color:#07583f;
}

.info{
    margin-top:9px;
    font-size:13px;
    line-height:1.9;
    color:#71817b;
}

.info b{
    color:#435c52;
}

.phone{
    color:#07583f;
    font-weight:bold;
    text-decoration:none;
}

.card-actions{
    display:flex;
    gap:7px;
    margin-top:10px;
    flex-wrap:wrap;
}

.small-btn{
    border:0;
    border-radius:9px;
    padding:8px 11px;
    font-size:12px;
    cursor:pointer;
}

.call{
    background:#e7f5ed;
    color:#07583f;
}

.edit{
    background:#edf4ff;
    color:#17608c;
}

.delete{
    background:#fff0f0;
    color:#b33a3a;
}

.empty{
    text-align:center;
    padding:40px 15px;
    color:#7c8c85;
    background:white;
    border-radius:18px;
    border:1px dashed #cbded5;
    line-height:1.8;
}

.footer{
    text-align:center;
    color:#94a29d;
    font-size:11px;
    padding:15px 0 20px;
}

/* =========================
   MODAL
========================= */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    z-index:100;
    align-items:flex-end;
    justify-content:center;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:480px;
    max-height:94vh;
    overflow:auto;
    background:white;
    border-radius:28px 28px 0 0;
    padding:20px 17px 30px;
}

.modal-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:16px;
}

.modal-head h3{
    color:#07583f;
    font-size:20px;
}

.close{
    border:0;
    background:#edf5f1;
    color:#07583f;
    width:38px;
    height:38px;
    border-radius:10px;
    font-size:22px;
    cursor:pointer;
}

.group{
    margin-bottom:13px;
}

.group label{
    display:block;
    font-size:13px;
    font-weight:bold;
    margin-bottom:5px;
}

.group input,
.group textarea{
    width:100%;
    padding:12px;
    border:1px solid #d7e7df;
    border-radius:12px;
    background:#fbfdfc;
    font-size:14px;
    outline:none;
}

.group textarea{
    min-height:80px;
    resize:vertical;
}

.save-btn{
    width:100%;
    border:0;
    background:#07583f;
    color:white;
    padding:14px;
    border-radius:13px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.cancel-btn{
    width:100%;
    border:0;
    background:#eaf5ef;
    color:#07583f;
    padding:13px;
    border-radius:13px;
    font-size:14px;
    margin-top:9px;
    cursor:pointer;
}

/* =========================
   MESSAGE
========================= */

.message{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translateX(-50%);
    background:#17382d;
    color:white;
    padding:11px 17px;
    border-radius:12px;
    font-size:13px;
    z-index:300;
    display:none;
    white-space:nowrap;
}

.message.show{
    display:block;
}

/* =========================
   SMALL SCREEN
========================= */

@media(max-width:360px){

    .brand h1{
        font-size:22px;
    }

    .header-title h2{
        font-size:18px;
    }

    .content{
        padding-left:11px;
        padding-right:11px;
    }

}
</style>    
<script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
        navigator.serviceWorker.register("./service-worker.js")
            .then(function () {
                console.log("HifzContact offline service ready");
            })
            .catch(function (error) {
                console.log("Service worker error:", error);
            });
    });
}
</script>

</head>


<body>

<div class="app">

<!-- =========================
     HEADER
========================= -->

<header class="header">

    <div class="top">

        <div class="logo">
            📖
        </div>

        <div class="brand">
            <h1>হেফজ<span>কন্টাক</span></h1>
            <p>সহজ যোগাযোগ</p>
        </div>

    </div>

    <div class="header-title">

        <small>আসসালামু আলাইকুম</small>

        <h2>
            শিক্ষার্থীদের যোগাযোগের তথ্য
        </h2>

    </div>

</header>


<!-- =========================
     MAIN
========================= -->

<main class="content">

    <input
        id="search"
        class="search"
        type="search"
        placeholder="🔍 শিক্ষার্থীর নাম খুঁজুন..."
        oninput="renderStudents()"
    >

    <button
        class="add-btn"
        onclick="openAddStudent()"
    >
        ➕ নতুন ছাত্র যোগ করুন
    </button>

    <div
        id="studentCount"
        class="count"
    >
        মোট শিক্ষার্থী: ০ জন
    </div>

    <div id="studentList"></div>

    <div class="footer">
        হেফজ কন্টাক • সহজ যোগাযোগ • অফলাইন
    </div>

</main>

</div>


<!-- =========================
     ADD / EDIT STUDENT MODAL
========================= -->

<div
    id="studentModal"
    class="modal"
>

    <div class="modal-box">

        <div class="modal-head">

            <h3 id="modalTitle">
                ➕ নতুন ছাত্র যোগ করুন
            </h3>

            <button
                class="close"
                onclick="closeStudentModal()"
            >
                ×
            </button>

        </div>


        <form id="studentForm">

            <input
                type="hidden"
                id="studentId"
            >


            <div class="group">

                <label>
                    ছাত্রের নাম *
                </label>

                <input
                    type="text"
                    id="studentName"
                    placeholder="ছাত্রের পূর্ণ নাম"
                    required
                >

            </div>


            <div class="group">

                <label>
                    বাবার নাম
                </label>

                <input
                    type="text"
                    id="fatherName"
                    placeholder="বাবার নাম"
                >

            </div>


            <div class="group">

                <label>
                    মোবাইল নম্বর *
                </label>

                <input
                    type="tel"
                    id="phoneNumber"
                    placeholder="01XXXXXXXXX"
                    required
                >

            </div>


            <div class="group">

                <label>
                    ঠিকানা
                </label>

                <textarea
                    id="studentAddress"
                    placeholder="গ্রাম, পোস্ট, থানা, জেলা"
                ></textarea>

            </div>


            <button
                class="save-btn"
                type="submit"
            >
                💾 তথ্য সংরক্ষণ করুন
            </button>


            <button
                class="cancel-btn"
                type="button"
                onclick="closeStudentModal()"
            >
                বাতিল
            </button>

        </form>

    </div>

</div>


<!-- =========================
     MESSAGE
========================= -->

<div
    id="message"
    class="message"
></div>


<script>

/* =========================
   DATA
========================= */

const STORAGE_KEY = "hefz_contact_students";

let students = [];


/* =========================
   LOAD DATA
========================= */

function loadStudents(){

    try{

        const saved =
            localStorage.getItem(STORAGE_KEY);

        students =
            saved ? JSON.parse(saved) : [];

        if(!Array.isArray(students)){
            students = [];
        }

    }catch(error){

        students = [];

    }

    renderStudents();
}


/* =========================
   SAVE DATA
========================= */

function saveStudents(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(students)
    );

    renderStudents();
}


/* =========================
   BANGLA NUMBER
========================= */

function banglaNumber(number){

    return String(number).replace(
        /\d/g,
        function(digit){

            return "০১২৩৪৫৬৭৮৯"[digit];

        }
    );

}


/* =========================
   HTML SECURITY
========================= */

function escapeHTML(value){

    return String(value || "").replace(
        /[&<>"']/g,
        function(character){

            const map = {

                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"

            };

            return map[character];

        }
    );

}


/* =========================
   SHOW STUDENTS
========================= */

function renderStudents(){

    const list =
        document.getElementById("studentList");

    const searchInput =
        document.getElementById("search");

    const search =
        (searchInput.value || "")
        .trim()
        .toLowerCase();


    const filtered =
        students.filter(function(student){

            const name =
                (student.name || "")
                .toLowerCase();

            const father =
                (student.father || "")
                .toLowerCase();

            const phone =
                (student.phone || "");

            return (
                name.includes(search) ||
                father.includes(search) ||
                phone.includes(search)
            );

        });


    document.getElementById(
        "studentCount"
    ).textContent =
        "মোট শিক্ষার্থী: "
        + banglaNumber(students.length)
        + " জন";


    if(filtered.length === 0){

        list.innerHTML = `
            <div class="empty">
                এখনো কোনো শিক্ষার্থী যোগ করা হয়নি।
                <br>
                উপরের “নতুন ছাত্র যোগ করুন” বাটনে চাপুন।
            </div>
        `;

        return;

    }


    list.innerHTML =
        filtered.map(function(student){

            return `

                <div class="student">

                    <div class="student-head">

                        <div class="avatar">
                            👨‍🎓
                        </div>

                        <div class="student-name">
                            ${escapeHTML(student.name)}
                        </div>

                    </div>


                    <div class="info">

                        <b>বাবার নাম:</b>
                        ${escapeHTML(
                            student.father || "দেওয়া হয়নি"
                        )}

                        <br>

                        <b>মোবাইল:</b>

                        <a
                            class="phone"
                            href="tel:${escapeHTML(student.phone)}"
                        >
                            ${escapeHTML(student.phone)}
                        </a>

                        <br>

                        <b>ঠিকানা:</b>
                        ${escapeHTML(
                            student.address || "দেওয়া হয়নি"
                        )}

                    </div>


                    <div class="card-actions">

                        <button
                            class="small-btn call"
                            onclick="callStudent('${student.id}')"
                        >
                            📞 কল
                        </button>


                        <button
                            class="small-btn edit"
                            onclick="editStudent('${student.id}')"
                        >
                            ✏️ পরিবর্তন
                        </button>


                        <button
                            class="small-btn delete"
                            onclick="deleteStudent('${student.id}')"
                        >
                            🗑️ মুছুন
                        </button>

                    </div>

                </div>

            `;

        }).join("");

}


/* =========================
   OPEN ADD FORM
========================= */

function openAddStudent(){

    document.getElementById(
        "studentForm"
    ).reset();

    document.getElementById(
        "studentId"
    ).value = "";


    document.getElementById(
        "modalTitle"
    ).textContent =
        "➕ নতুন ছাত্র যোগ করুন";


    document.getElementById(
        "studentModal"
    ).classList.add("show");


    setTimeout(function(){

        document.getElementById(
            "studentName"
        ).focus();

    },100);

}


/* =========================
   CLOSE FORM
========================= */

function closeStudentModal(){

    document.getElementById(
        "studentModal"
    ).classList.remove("show");

}


/* =========================
   SAVE STUDENT
========================= */

document.getElementById(
    "studentForm"
).addEventListener(
    "submit",
    function(event){

        event.preventDefault();


        const id =
            document.getElementById(
                "studentId"
            ).value;


        const name =
            document.getElementById(
                "studentName"
            ).value.trim();


        const father =
            document.getElementById(
                "fatherName"
            ).value.trim();


        const phone =
            document.getElementById(
                "phoneNumber"
            ).value.trim();


        const address =
            document.getElementById(
                "studentAddress"
            ).value.trim();


        if(!name){

            alert(
                "দয়া করে ছাত্রের নাম লিখুন।"
            );

            return;

        }


        if(!phone){

            alert(
                "দয়া করে মোবাইল নম্বর লিখুন।"
            );

            return;

        }


        const student = {

            id:
                id ||
                Date.now().toString(),

            name:name,

            father:father,

            phone:phone,

            address:address

        };


        /* EDIT */

        if(id){

            const index =
                students.findIndex(
                    function(item){

                        return item.id === id;

                    }
                );


            if(index !== -1){

                students[index] =
                    student;

            }


            saveStudents();

            closeStudentModal();

            showMessage(
                "শিক্ষার্থীর তথ্য পরিবর্তন হয়েছে"
            );

        }


        /* NEW STUDENT */

        else{

            students.unshift(student);

            saveStudents();

            closeStudentModal();

            showMessage(
                "শিক্ষার্থী সফলভাবে সংরক্ষণ হয়েছে"
            );

        }

    }
);


/* =========================
   EDIT STUDENT
========================= */

function editStudent(id){

    const student =
        students.find(
            function(item){

                return item.id === id;

            }
        );


    if(!student){

        return;

    }


    document.getElementById(
        "studentId"
    ).value =
        student.id;


    document.getElementById(
        "studentName"
    ).value =
        student.name || "";


    document.getElementById(
        "fatherName"
    ).value =
        student.father || "";


    document.getElementById(
        "phoneNumber"
    ).value =
        student.phone || "";


    document.getElementById(
        "studentAddress"
    ).value =
        student.address || "";


    document.getElementById(
        "modalTitle"
    ).textContent =
        "✏️ শিক্ষার্থীর তথ্য পরিবর্তন";


    document.getElementById(
        "studentModal"
    ).classList.add("show");

}


/* =========================
   DELETE STUDENT
========================= */

function deleteStudent(id){

    const student =
        students.find(
            function(item){

                return item.id === id;

            }
        );


    if(!student){

        return;

    }


    const confirmed =
        confirm(
            "“"
            + student.name
            + "” এর তথ্য মুছে ফেলতে চান?"
        );


    if(!confirmed){

        return;

    }


    students =
        students.filter(
            function(item){

                return item.id !== id;

            }
        );


    saveStudents();

    showMessage(
        "শিক্ষার্থীর তথ্য মুছে ফেলা হয়েছে"
    );

}


/* =========================
   CALL STUDENT
========================= */

function callStudent(id){

    const student =
        students.find(
            function(item){

                return item.id === id;

            }
        );


    if(
        student &&
        student.phone
    ){

        window.location.href =
            "tel:" + student.phone;

    }

}


/* =========================
   MESSAGE
========================= */

function showMessage(text){

    const message =
        document.getElementById(
            "message"
        );


    message.textContent = text;

    message.classList.add("show");


    setTimeout(function(){

        message.classList.remove(
            "show"
        );

    },2000);

}


/* =========================
   CLOSE MODAL BY OUTSIDE TAP
========================= */

document.getElementById(
    "studentModal"
).addEventListener(
    "click",
    function(event){

        if(
            event.target ===
            document.getElementById(
                "studentModal"
            )
        ){

            closeStudentModal();

        }

    }
);


/* =========================
   START APP
========================= */

loadStudents();

</script>

</body>
  </html>
